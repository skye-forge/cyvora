<script>
        (function () {
            var SEVERITY_STYLES = {
                critical: "bg-error-container text-on-error-container",
                high: "bg-error-container text-on-error-container",
                medium: "bg-tertiary-fixed text-on-tertiary-fixed-variant",
                low: "bg-secondary-container text-on-secondary-container",
            };
            var STATUS_META = {
                pending: { label: "Pending", dot: "bg-error animate-pulse" },
                in_review: { label: "In Review", dot: "bg-surface-tint" },
                approved: { label: "Resolved", dot: "bg-secondary" },
                rejected: { label: "Rejected", dot: "bg-outline" },
            };
            var NEXT_STATUS = { pending: "in_review", in_review: "approved", approved: "approved", rejected: "rejected" };

            function render(reports) {
                var tbody = document.getElementById("admin-reports-tbody");
                if (!reports.length) {
                    tbody.innerHTML = '<tr><td class="px-6 py-8 text-center text-on-surface-variant font-body-md" colspan="8">No reports match these filters.</td></tr>';
                    return;
                }
                tbody.innerHTML = reports.map(function (r) {
                    var sevClass = SEVERITY_STYLES[r.severity] || SEVERITY_STYLES.medium;
                    var statusMeta = STATUS_META[r.status] || STATUS_META.pending;
                    var isFinal = r.status === "approved" || r.status === "rejected";
                    return (
                        '<tr class="hover:bg-surface-container-lowest transition-colors group reveal" data-report-id="' + r.id + '">' +
                            '<td class="px-6 py-4 font-table-cell text-table-cell font-medium">' + r.trackingId + '</td>' +
                            '<td class="px-6 py-4 font-table-cell text-table-cell">' + r.title + '</td>' +
                            '<td class="px-6 py-4 font-table-cell text-table-cell">' + r.category + '</td>' +
                            '<td class="px-6 py-4 font-table-cell text-table-cell">' + r.reporterName + '</td>' +
                            '<td class="px-6 py-4 font-table-cell text-table-cell">' + r.district + '</td>' +
                            '<td class="px-6 py-4"><span class="px-2 py-1 rounded text-[10px] font-bold uppercase ' + sevClass + '">' + r.severity + '</span></td>' +
                            '<td class="px-6 py-4"><span class="flex items-center gap-1.5 text-table-cell font-medium text-on-surface"><span class="w-2 h-2 rounded-full ' + statusMeta.dot + '"></span>' + statusMeta.label + '</span></td>' +
                            '<td class="px-6 py-4 text-right">' +
                                '<button class="px-4 py-1.5 border border-primary text-primary font-label-md rounded group-hover:bg-primary group-hover:text-on-primary transition-all review-btn" ' +
                                (isFinal ? "disabled" : "") + '>' + (isFinal ? "Reviewed" : "Review") + '</button>' +
                            '</td>' +
                        '</tr>'
                    );
                }).join("");

                tbody.querySelectorAll(".review-btn").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        var row = btn.closest("tr");
                        var id = row.getAttribute("data-report-id");
                        var report = allReports.find(function (r) { return r.id === id; });
                        var next = NEXT_STATUS[report.status] || "in_review";
                        btn.disabled = true;
                        window.CyvoraAPI.reports.updateStatus(id, next).then(function () {
                            window.showToast("Report moved to " + next.replace("_", " ") + ".", "success");
                            loadReports();
                        }).catch(function () {
                            window.showToast("Could not update this report.", "error");
                            btn.disabled = false;
                        });
                    });
                });
            }

            var allReports = [];
            function loadReports() {
                window.CyvoraAPI.reports.list().then(function (res) {
                    allReports = res.items;
                    render(allReports);
                }).catch(function () {
                    document.getElementById("admin-reports-tbody").innerHTML =
                        '<tr><td class="px-6 py-8 text-center text-error font-body-md" colspan="8">Could not load reports.</td></tr>';
                });
            }
            document.addEventListener("DOMContentLoaded", loadReports);
        })();
    </script>
