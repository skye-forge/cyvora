<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Language | VARNIS</title>
<link rel="icon" type="image/jpeg" href="../assets/img/varnis-logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&amp;family=Work+Sans:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/tailwind-output.css"/>
<link rel="stylesheet" href="../assets/css/site.css"/>
    <script src="../assets/js/i18n.js"></script>
<script src="../assets/js/auth-guard.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">

<div class="w-full max-w-lg">
  <div class="text-center mb-10">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary text-on-primary mb-4">
      <span class="material-symbols-outlined text-3xl">translate</span>
    </div>
    <h1 class="text-headline-lg font-bold text-on-surface">Choose your language</h1>
    <p class="text-on-surface-variant mt-2">Choisissez votre langue · Select your language</p>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <button type="button" onclick="(window.setLanguage?setLanguage('en'):localStorage.setItem('cyvora_lang','en')); location.href='assessment.html';"
      class="bg-surface-container-lowest border-2 border-outline-variant hover:border-primary rounded-lg p-8 text-left transition group">
      <span class="text-4xl mb-3 block">🇬🇧</span>
      <span class="text-headline-md font-semibold text-on-surface group-hover:text-primary">English</span>
      <p class="text-label-md text-on-surface-variant mt-1">Continue in English</p>
    </button>
    <button type="button" onclick="(window.setLanguage?setLanguage('fr'):localStorage.setItem('cyvora_lang','fr')); location.href='assessment.html';"
      class="bg-surface-container-lowest border-2 border-outline-variant hover:border-primary rounded-lg p-8 text-left transition group">
      <span class="text-4xl mb-3 block">🇫🇷</span>
      <span class="text-headline-md font-semibold text-on-surface group-hover:text-primary">Français</span>
      <p class="text-label-md text-on-surface-variant mt-1">Continuer en français</p>
    </button>
  </div>
  <p class="text-center text-caption text-outline mt-8">You can change language anytime in Settings</p>
</div>


</body>
</html>
