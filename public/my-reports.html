<script>
        (function () {
            var STATUS_META = {
                pending: { label: "Pending Review", dot: "bg-outline", badge: "bg-surface-container-highest text-on-surface-variant border border-outline-variant" },
                in_review: { label: "Under Investigation", dot: "bg-primary-container animate-pulse", badge: "bg-primary-container/10 text-primary-container border border-primary-container/20" },
                approved: { label: "Resolved", dot: "bg-secondary", badge: "bg-secondary/10 text-secondary border border-secondary/20" },
                rejected: { label: "Closed — Not Actioned", dot: "bg-error", badge: "bg-error/10 text-error border border-error/20" },
            };
            var CATEGORY_ICON = {
                "Utility Failure": "traffic",
                "Suspicious Activity": "security",
                "Road Hazards": "warning",
                "Urban Improvement": "home",
                "Public Safety": "security",
                "Infrastructure Issue": "construction",
                "Fire & Hazards": "local_fire_department",
                "Medical Emergency": "health_and_safety",
                "Environmental": "eco",
                "Other": "language",
            };

            function formatDate(iso) {
                var d = new Date(iso);
                return d.toLocaleDateString(undefined, { month: "short", day: "2-digit", year: "numeric" });
            }

            function render(reports) {
                var tbody = document.getElementById("my-reports-tbody");
                if (!reports.length) {
                    tbody.innerHTML = '<tr><td class="px-8 py-10 text-center text-on-surface-variant font-body-md" colspan="5">You have not filed any reports yet. <a class="text-primary hover:underline" href="report-incident.html">File your first report</a>.</td></tr>';
                    return;
                }
                tbody.innerHTML = reports.map(function (r) {
                    var meta = STATUS_META[r.status] || STATUS_META.pending;
                    var icon = CATEGORY_ICON[r.category] || "description";
                    return (
                        '<tr class="report-row bg-white transition-all duration-200 group border-l-4 border-transparent hover:border-primary cursor-pointer reveal">' +
                            '<td class="px-8 py-6">' +
                                '<span class="font-label-lg text-label-lg text-primary">#' + r.trackingId + '</span>' +
                                '<div class="text-caption text-outline mt-1">Submitted: ' + formatDate(r.createdAt) + '</div>' +
                            '</td>' +
                            '<td class="px-8 py-6">' +
                                '<div class="flex items-center gap-2">' +
                                    '<span class="material-symbols-outlined text-on-surface-variant">' + icon + '</span>' +
                                    '<span class="font-body-md text-body-md text-on-surface">' + r.title + '</span>' +
                                '</div>' +
                            '</td>' +
                            '<td class="px-8 py-6 font-body-md text-body-md text-on-surface">' + r.district + '</td>' +
                            '<td class="px-8 py-6">' +
                                '<span class="inline-flex items-center px-3 py-1 rounded-full text-caption font-label-md ' + meta.badge + '">' +
                                    '<span class="w-2 h-2 rounded-full ' + meta.dot + ' mr-2"></span>' + meta.label +
                                '</span>' +
                            '</td>' +
                            '<td class="px-8 py-6 text-right">' +
                                '<button class="text-primary hover:bg-primary/5 p-2 rounded-lg transition-colors font-label-lg text-label-lg flex items-center justify-end gap-2 ml-auto">' +
                                    'View Details<span class="material-symbols-outlined">arrow_forward</span>' +
                                '</button>' +
                            '</td>' +
                        '</tr>'
                    );
                }).join("");
            }

            document.addEventListener("DOMContentLoaded", function () {
                window.CyvoraAPI.reports.list().then(function (res) {
                    render(res.items);
                }).catch(function () {
                    document.getElementById("my-reports-tbody").innerHTML =
                        '<tr><td class="px-8 py-10 text-center text-error font-body-md" colspan="5">Could not load your reports. Please refresh the page.</td></tr>';
                });
            });
        })();
    </script>
