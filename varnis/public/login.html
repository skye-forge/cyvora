<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign in | VARNIS</title>
<link rel="icon" type="image/jpeg" href="../assets/img/varnis-logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&amp;family=Work+Sans:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/tailwind-output.css"/>
<link rel="stylesheet" href="../assets/css/site.css"/>
<link rel="manifest" href="../manifest.json" />
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/i18n.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-white border border-outline-variant mb-4 overflow-hidden"><img src="../assets/img/varnis-logo.jpeg" alt="VARNIS" class="w-full h-full object-contain p-1"></div>
    <a href="landing.html"><h1 class="text-headline-lg font-bold text-primary hover:opacity-80 transition-opacity">VARNIS</h1></a>
    <p class="text-on-surface-variant text-label-md mt-1">ANTIC Civic Safety Platform</p>
  </div>
  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-8 shadow-sm">
    <h2 class="text-headline-md font-semibold text-on-surface mb-6" data-i18n="login.title">Sign in</h2>
    <div id="login-expired-note" class="mb-5 hidden rounded-lg bg-primary/10 px-4 py-3 text-body-md text-primary" role="status">
      Your session expired. Please sign in again to continue.
    </div>
    <form id="login-form" class="flex flex-col gap-5">
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="login.identifier">Phone or email</label>
        <input type="text" required name="identifier" placeholder="+237 6XX XXX XXX or email"
          class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-body-md"/>
      </div>
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="login.password">Password</label>
        <input type="password" required name="password" placeholder="••••••••"
          class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-body-md"/>
      </div>
      <div class="flex items-center justify-between text-label-md">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="rounded border-outline-variant text-primary focus:ring-primary"/>
          <span class="text-on-surface-variant" data-i18n="login.remember">Remember me</span>
        </label>
        <a href="#" class="text-primary font-label-lg hover:underline" data-i18n="login.forgot">Forgot password?</a>
      </div>
      <button type="submit" class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-lg hover:opacity-90 transition" data-i18n="login.button">Continue</button>
    </form>
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
      <div class="relative flex justify-center"><span class="bg-surface-container-lowest px-3 text-caption text-outline" data-i18n="login.or">or</span></div>
    </div>
    <button type="button" id="google-signin" class="w-full h-12 border border-outline-variant rounded-lg font-label-lg flex items-center justify-center gap-3 hover:bg-surface-container-low transition disabled:opacity-60">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      <span data-i18n="login.google">Continue with Google</span>
    </button>
    <p class="text-center text-label-md text-on-surface-variant mt-6">
      <span data-i18n="login.new_user">New to VARNIS?</span> <a href="register.html" class="text-primary font-label-lg hover:underline" data-i18n="login.create_account">Create account</a>
    </p>
  </div>
  <p class="text-center text-caption text-outline mt-6">Republic of Cameroon · ANTIC Platform · National ICT Competition 2026</p>
</div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("login-form");
  if (!form) return;

  // Show a friendly notice when the app bounced us here on an expired/stale
  // session (see api.js handleAuthFailure → login.html?expired=1).
  try {
    if (new URLSearchParams(location.search).get("expired") === "1") {
      var note = document.getElementById("login-expired-note");
      if (note) note.classList.remove("hidden");
    }
  } catch (e) { /* ignore */ }

  if (window.initInlineValidation) window.initInlineValidation(form);

  // Simple rate limiting for unauthorized entry attempts (demo)
  var ATTEMPT_KEY = "varnis_login_attempts";
  var LOCK_KEY = "varnis_login_locked_until";
  var MAX_ATTEMPTS = 5;
  var LOCK_DURATION_MIN = 5;

  function getAttempts() {
    try { return parseInt(localStorage.getItem(ATTEMPT_KEY) || "0", 10); } catch(e) { return 0; }
  }
  function incrementAttempts() {
    var n = getAttempts() + 1;
    try { localStorage.setItem(ATTEMPT_KEY, n); } catch(e){}
    return n;
  }
  function resetAttempts() {
    try { localStorage.removeItem(ATTEMPT_KEY); localStorage.removeItem(LOCK_KEY); } catch(e){}
  }
  function isLocked() {
    try {
      var until = parseInt(localStorage.getItem(LOCK_KEY) || "0", 10);
      if (until > Date.now()) return true;
      if (until) { localStorage.removeItem(LOCK_KEY); }
      return false;
    } catch(e) { return false; }
  }
  function lockAccount() {
    var until = Date.now() + LOCK_DURATION_MIN * 60 * 1000;
    try { localStorage.setItem(LOCK_KEY, until); } catch(e){}
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    if (isLocked()) {
      var msg = "Too many failed attempts. Please try again in " + LOCK_DURATION_MIN + " minutes.";
      if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
        window.VarnisValidation.showValidationErrors([msg]);
      } else {
        alert(msg);
      }
      return;
    }

    var identifier = (form.querySelector("[name=identifier]") || {}).value || "";
    var password = (form.querySelector("[name=password]") || {}).value || "";

    if (window.VarnisValidation) {
      var v = window.VarnisValidation.validateLogin(identifier, password);
      if (!v.valid) {
        window.VarnisValidation.showValidationErrors(v.errors);
        incrementAttempts();
        if (getAttempts() >= MAX_ATTEMPTS) {
          lockAccount();
          alert("Account temporarily locked due to multiple invalid attempts.");
        }
        return;
      }
    } else {
      // fallback basic
      if (!identifier.trim() || !password.trim()) {
        alert("Please enter phone/email and password.");
        return;
      }
    }

    // Call the secure API (will also validate again in api.js)
    if (window.VarnisAPI && window.VarnisAPI.auth && window.VarnisAPI.auth.login) {
      window.VarnisAPI.auth.login(identifier, password)
        .then(function (res) {
          resetAttempts();
          // Store token + user (auth-guard.js checks the token; the user
          // object carries the role for the future admin gate)
          try {
            if (res && res.token) {
              var cfg = window.VarnisConfig || {};
              localStorage.setItem(cfg.AUTH_TOKEN_KEY || "varnis_token", res.token);
            }
            if (res && res.user) {
              localStorage.setItem("varnis_user", JSON.stringify(res.user));
            }
          } catch(e){}
          // Returning user bounced here by auth-guard.js? Send them back
          // to where they were headed. Otherwise follow the documented
          // flow: login → OTP → language → assessment → home.
          var target = null;
          try {
            target = sessionStorage.getItem("varnis_post_login_redirect");
            sessionStorage.removeItem("varnis_post_login_redirect");
          } catch(e){}
          location.href = target || "otp.html";
        })
        .catch(function (err) {
          var attempts = incrementAttempts();
          var msg = (err && err.message) || "Login failed. Please check your credentials.";
          if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
            window.VarnisValidation.showValidationErrors([msg]);
          } else {
            alert(msg);
          }
          if (attempts >= MAX_ATTEMPTS) {
            lockAccount();
            alert("Too many failed login attempts. Temporarily locked for " + LOCK_DURATION_MIN + " minutes.");
          }
        });
    } else {
      // Fallback if API not ready
      resetAttempts();
      location.href = "language.html";
    }
  });

  // ------------------------------------------------------------------
  // Continue with Google (OAuth 2.0)
  // ------------------------------------------------------------------
  // The backend owns the handshake: VarnisAPI.auth.google() redirects to
  // GOOGLE_OAUTH_START_PATH in live mode, and emulates a round-trip in mock
  // mode so the flow is demonstrable without a server. On return we honour
  // the SRS routing rule — a brand-new account goes to identity
  // verification first, an existing one lands wherever it was headed.
  var googleBtn = document.getElementById("google-signin");
  if (googleBtn) {
    googleBtn.addEventListener("click", function () {
      if (!window.VarnisAPI || !window.VarnisAPI.auth || !window.VarnisAPI.auth.google) {
        location.href = "language.html";
        return;
      }
      var label = googleBtn.querySelector("span[data-i18n]");
      var original = label ? label.textContent : "";
      googleBtn.disabled = true;
      if (label) label.textContent = "Connecting to Google…";

      window.VarnisAPI.auth.google()
        .then(function (res) {
          if (res && res.redirecting) return; // browser is navigating away
          resetAttempts();
          routeAfterSignIn(res && res.user);
        })
        .catch(function (err) {
          googleBtn.disabled = false;
          if (label) label.textContent = original;
          var msg = (err && err.message) || "Google sign-in didn't complete. Try again, or sign in with your phone number.";
          if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
            window.VarnisValidation.showValidationErrors([msg]);
          } else { alert(msg); }
        });
    });
  }

  /** Where a signed-in user lands. New accounts must verify identity before
   *  reporting, learning, certification or device recovery, so they go
   *  straight to KYC; everyone else resumes their journey. */
  function routeAfterSignIn(user) {
    var target = null;
    try {
      target = sessionStorage.getItem("varnis_post_login_redirect");
      sessionStorage.removeItem("varnis_post_login_redirect");
    } catch (e) { /* ignore */ }
    if (target) { location.href = target; return; }

    var isNew = !!(user && (user.isNew || user.createdNow));
    if (isNew) { location.href = "kyc.html?welcome=1"; return; }

    if (window.VarnisAPI && window.VarnisAPI.kyc) {
      window.VarnisAPI.kyc.get()
        .then(function (rec) {
          var s = (rec && rec.status) || "draft";
          location.href = (s === "draft" || s === "rejected" || s === "expired") ? "kyc.html" : "index.html";
        })
        .catch(function () { location.href = "index.html"; });
      return;
    }
    location.href = "index.html";
  }

  // Clear attempts on successful page load (optional)
  // resetAttempts(); // uncomment if you want fresh on every visit

  // If storage can't persist (usually opened via file://), the token won't
  // stick and every protected page will bounce back here. Warn instead of
  // failing silently.
  (function storageCheck() {
    var ok = true;
    try { localStorage.setItem("__cyv_probe__", "1"); localStorage.removeItem("__cyv_probe__"); }
    catch (e) { ok = false; }
    if (!ok && location.protocol === "file:") {
      var note = document.createElement("p");
      note.className = "text-caption text-error text-center mt-4";
      note.textContent = "Opened as a file, so sign-in can't be saved. Serve the folder over http:// (see README) to log in.";
      if (form && form.parentNode) form.parentNode.appendChild(note);
    }
  })();
})();
</script>

</body>
</html>
