<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | VARNIS</title>
<link rel="icon" type="image/jpeg" href="../assets/img/varnis-logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&amp;family=Work+Sans:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/tailwind-output.css"/>
<link rel="stylesheet" href="../assets/css/site.css"/>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/mock-data.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/i18n.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 antialiased">

<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-white border border-outline-variant mb-4 overflow-hidden"><img src="../assets/img/varnis-logo.jpeg" alt="VARNIS" class="w-full h-full object-contain p-1"></div>
    <a href="landing.html" class="mb-2 inline-flex items-center gap-1 text-label-md text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined text-[16px]">arrow_back</span> Home</a>
    <h1 class="text-headline-lg font-bold text-primary" data-i18n="register.title">Create account</h1>
    <p class="text-on-surface-variant text-label-md mt-1">Join Cameroon's digital safety community</p>
  </div>
  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-8">
    <form class="flex flex-col gap-4" id="register-form">
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="register.name">Full name</label>
        <input id="reg-name" type="text" required class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" placeholder="Jean Dupont"/>
      </div>
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="register.phone">Phone number</label>
        <input id="reg-phone" type="tel" required class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" placeholder="+237 6XX XXX XXX"/>
      </div>
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="register.email">Email (optional)</label>
        <input id="reg-email" type="email" class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" placeholder="you@example.com"/>
      </div>
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="register.password">Password</label>
        <input id="reg-password" type="password" required minlength="8" class="w-full h-12 px-4 border border-outline-variant rounded-lg bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" placeholder="Min. 8 characters"/>
      </div>
      <div>
        <label class="block font-label-lg text-on-surface-variant mb-2" data-i18n="register.idcard">National ID card</label>
        <input id="reg-idcard" type="file" required accept="image/jpeg,image/png,image/webp,application/pdf" class="hidden"/>
        <label for="reg-idcard" id="idcard-dropzone" class="flex flex-col items-center justify-center gap-2 w-full min-h-28 px-4 py-5 border-2 border-dashed border-outline-variant rounded-lg bg-surface cursor-pointer hover:border-primary hover:bg-primary/5 transition-colors text-center">
          <span class="material-symbols-outlined text-3xl text-on-surface-variant">badge</span>
          <span class="text-label-md text-on-surface-variant" data-i18n="register.idcard_hint">Upload a photo or scan of your ID card (JPG, PNG or PDF · max 5 MB)</span>
        </label>
        <div id="idcard-preview" class="hidden mt-2 flex items-center gap-3 p-3 border border-outline-variant rounded-lg bg-surface">
          <img id="idcard-thumb" alt="ID preview" class="hidden w-14 h-10 object-cover rounded border border-outline-variant"/>
          <span id="idcard-icon" class="hidden material-symbols-outlined text-2xl text-primary">picture_as_pdf</span>
          <div class="flex-1 min-w-0">
            <p id="idcard-filename" class="text-label-md font-semibold text-on-surface truncate"></p>
            <p id="idcard-filesize" class="text-caption text-on-surface-variant"></p>
          </div>
          <button type="button" id="idcard-remove" class="material-symbols-outlined text-on-surface-variant hover:text-error" aria-label="Remove file">close</button>
        </div>
      </div>
      <label class="flex items-start gap-2 text-label-md text-on-surface-variant cursor-pointer">
        <input type="checkbox" required class="mt-1 rounded border-outline-variant text-primary"/>
        <span data-i18n="register.terms">I agree to the Terms of Governance and consent to data processing under CPDP regulations.</span>
      </label>
      <button type="submit" class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-lg hover:opacity-90" data-i18n="register.button">Register &amp; verify</button>
    </form>
    <p class="text-center text-label-md text-on-surface-variant mt-6">
      Already have an account? <a href="login.html" class="text-primary font-label-lg hover:underline">Sign in</a>
    </p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("register-form");
  if (!form) return;

  if (window.initInlineValidation) window.initInlineValidation(form);

  /* ---------------- ID card upload ---------------- */
  var ID_MAX_BYTES = 5 * 1024 * 1024; // 5 MB
  var ID_TYPES = ["image/jpeg", "image/png", "image/webp", "application/pdf"];

  var idInput = document.getElementById("reg-idcard");
  var dropzone = document.getElementById("idcard-dropzone");
  var preview = document.getElementById("idcard-preview");
  var thumb = document.getElementById("idcard-thumb");
  var pdfIcon = document.getElementById("idcard-icon");
  var fileName = document.getElementById("idcard-filename");
  var fileSize = document.getElementById("idcard-filesize");
  var removeBtn = document.getElementById("idcard-remove");

  function prettySize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function validateIdFile(file) {
    if (!file) return "Please upload a photo or scan of your ID card.";
    if (ID_TYPES.indexOf(file.type) === -1) return "ID card must be a JPG, PNG, WebP image or a PDF.";
    if (file.size > ID_MAX_BYTES) return "ID card file is too large (max 5 MB).";
    return null;
  }

  function clearIdFile() {
    idInput.value = "";
    preview.classList.add("hidden");
    dropzone.classList.remove("hidden");
    thumb.classList.add("hidden");
    thumb.removeAttribute("src");
    pdfIcon.classList.add("hidden");
  }

  idInput.addEventListener("change", function () {
    var file = idInput.files && idInput.files[0];
    if (!file) { clearIdFile(); return; }

    var err = validateIdFile(file);
    if (err) {
      clearIdFile();
      if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
        window.VarnisValidation.showValidationErrors([err]);
      } else { alert(err); }
      return;
    }

    fileName.textContent = file.name;
    fileSize.textContent = prettySize(file.size);
    if (file.type === "application/pdf") {
      pdfIcon.classList.remove("hidden");
      thumb.classList.add("hidden");
    } else {
      var reader = new FileReader();
      reader.onload = function () { thumb.src = reader.result; thumb.classList.remove("hidden"); };
      reader.readAsDataURL(file);
      pdfIcon.classList.add("hidden");
    }
    dropzone.classList.add("hidden");
    preview.classList.remove("hidden");
    preview.classList.add("flex");
  });

  removeBtn.addEventListener("click", clearIdFile);

  /** Read the ID file as a base64 data URL for the JSON payload. */
  function readIdFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve({ fileName: file.name, mimeType: file.type, size: file.size, data: reader.result });
      };
      reader.onerror = function () { reject(new Error("Could not read the ID card file.")); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- Submit ---------------- */
  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var name = document.getElementById("reg-name").value || "";
    var phone = document.getElementById("reg-phone").value || "";
    var email = document.getElementById("reg-email").value || "";
    var password = document.getElementById("reg-password").value || "";
    var idFile = idInput.files && idInput.files[0];

    var errors = [];

    if (window.VarnisValidation) {
      var nameV = window.VarnisValidation.validateTextField(name, "Full name", 2, 80);
      if (!nameV.valid) errors.push(nameV.error);

      var phoneV = window.VarnisValidation.validatePhone(phone);
      if (!phoneV.valid) errors.push(phoneV.error);

      if (email) {
        var emailV = window.VarnisValidation.validateEmail(email);
        if (!emailV.valid) errors.push(emailV.error);
      }

      if (password.length < 8) {
        errors.push("Password must be at least 8 characters");
      } else {
        var mal = window.VarnisValidation.detectMaliciousInput(password);
        if (mal.isMalicious) errors.push("Password contains suspicious patterns.");
      }
    } else {
      if (!name.trim() || !phone.trim() || password.length < 8) {
        errors.push("Please fill required fields correctly (name, phone, password min 8 chars).");
      }
    }

    var idErr = validateIdFile(idFile);
    if (idErr) errors.push(idErr);

    if (errors.length > 0) {
      if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
        window.VarnisValidation.showValidationErrors(errors);
      } else {
        alert(errors.join("\n"));
      }
      return;
    }

    if (window.VarnisValidation) {
      name = window.VarnisValidation.sanitizeInput(name, 80);
      phone = window.VarnisValidation.sanitizeInput(phone, 20);
    }

    var submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.classList.add("opacity-60");

    readIdFile(idFile)
      .then(function (idCard) {
        var payload = { name: name, phone: phone, email: email || null, password: password, idCard: idCard };
        // POST /auth/register — real endpoint in live mode, seeded mock otherwise.
        if (window.VarnisAPI && window.VarnisAPI.auth && window.VarnisAPI.auth.register) {
          return window.VarnisAPI.auth.register(payload);
        }
        return { otpRequired: true }; // no API layer loaded — proceed to demo OTP
      })
      .then(function () {
        // Cache the pending identity so otp.html knows who is verifying.
        if (window.VarnisStore && window.VarnisStore.setUser) {
          window.VarnisStore.setUser({ name: name, phone: phone, email: email || phone });
        }
        location.href = "otp.html";
      })
      .catch(function (err) {
        var msg = (err && err.validationErrors && err.validationErrors.join(" • ")) ||
                  (err && err.message) || "Registration failed. Please try again.";
        if (window.VarnisValidation && window.VarnisValidation.showValidationErrors) {
          window.VarnisValidation.showValidationErrors([msg]);
        } else { alert(msg); }
      })
      .then(function () {
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-60");
      });
  });
})();
</script>

</body>
</html>
